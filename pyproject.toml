[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "og-awc"
version = "0.1.0"
description = "Deterministic, provenance-aware academic writing corpus tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Og-AWC contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]\nhf = ["datasets>=3.0", "huggingface_hub>=0.25"]

[project.scripts]
og-awc = "og_awc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
